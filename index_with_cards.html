
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ذاكر ببساطة</title>
<style>
body {
  font-family: Arial, sans-serif;
  direction: rtl;
  background: #f4f4f4;
  margin: 0;
}
header {
  background: #2c3e50;
  color: white;
  padding: 15px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header svg {
  margin-left: 15px;
}
h1 {
  font-size: 24px;
  margin: 0;
}
nav {
  background-color: #34495e;
  display: flex;
  justify-content: center;
  padding: 10px 0;
}
nav a {
  color: white;
  text-decoration: none;
  margin: 0 15px;
  font-weight: bold;
}
nav a:hover {
  text-decoration: underline;
}
section {
  padding: 20px;
}
.cards-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.card {
  background-color: white;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  padding: 20px;
  text-align: center;
  transition: 0.3s ease;
}
.card:hover {
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.card a {
  text-decoration: none;
  color: #2c3e50;
  font-weight: bold;
  display: block;
}
</style>
</head>
<body>

<header>
  <div style="display: flex; align-items: center;">
    
<svg width="32" height="32" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
  <path d="M6 4V20C6 20.5523 6.44772 21 7 21H20C20.5523 21 21 20.5523 21 20V4C21 3.44772 20.5523 3 20 3H7C6.44772 3 6 3.44772 6 4Z" stroke="#ffffff" stroke-width="2" fill="#3498db"/>
  <path d="M6 7H21" stroke="white" stroke-width="2"/>
</svg>

    <h1>ذاكر ببساطة</h1>
  </div>
</header>

<nav>
  <a href="#">الرئيسية</a>
  <a href="#">حول الموقع</a>
  <a href="#">تواصل معنا</a>
</nav>

<section>
  <h2>اختر المادة التي تريد مراجعتها</h2>
  <div class="cards-container">
    <div class="card"><a href="#">الرياضيات</a></div>
    <div class="card"><a href="#">الفيزياء</a></div>
    <div class="card"><a href="#">علوم الطبيعة والحياة</a></div>
    <div class="card"><a href="#">العلوم الشرعية</a></div>
    <div class="card"><a href="#">اللغة العربية</a></div>
    <div class="card"><a href="#">اللغة الفرنسية</a></div>
    <div class="card"><a href="#">اللغة الإنجليزية</a></div>
    <div class="card"><a href="#">التاريخ</a></div>
    <div class="card"><a href="#">الجغرافيا</a></div>
  </div>
</section>

</body>
</html>
